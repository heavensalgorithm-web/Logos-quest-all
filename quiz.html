function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("logos_quest_lang", lang);
  applyTranslations();
  renderExams();
}

function applyTranslations() {
  const t = i18n[currentLang] || i18n.te;
  $("langSelect").value = currentLang;
  $("txtSub").textContent = t.welcome;
  $("txtExamsHeader").textContent = t.examsHeader;
  $("txtIstNotice").textContent = t.istNotice;
  $("refreshBtn").textContent = t.refresh;
  $("txtWinnersHeader").textContent = t.winnersHeader;
  $("txtWinnersSub").textContent = t.winnersSub;
  $("linkLeaderboard").textContent = t.viewLeaderboard;
  $("txtResultsHeader").textContent = t.resultsHeader;
  $("txtResultsSub").textContent = t.resultsSub;
  $("linkResults").textContent = t.viewResults;
}

function formatIST(value){
  return new Intl.DateTimeFormat("en-IN",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    hour12:true
  }).format(new Date(value));
}

function makeText(tag,text){
  const element = document.createElement(tag);
  element.textContent = text;
  return element;
}

function joinExam(exam){
  const t = i18n[currentLang] || i18n.te;
  const now = Date.now();
  const start = new Date(exam.start_time).getTime();
  const end = new Date(exam.end_time).getTime();

  if(now < start){
    alert(t.alertNotStarted);
    return;
  }

  if(now >= end){
    alert(t.alertEnded);
    return;
  }

  // డైరెక్ట్‌గా quiz.html కి వెళ్లేలా కనెక్ట్ చేయడం
  const params = new URLSearchParams({
    exam_id: String(exam.id),
    lang: currentLang
  });

  window.location.href = "quiz.html?" + params.toString();
}

function renderExams(){
  const t = i18n[currentLang] || i18n.te;
  const list = $("examList");
  list.replaceChildren();

  const now = Date.now();
  const visible = exams.filter(exam => new Date(exam.end_time).getTime() > now);

  if(!visible.length){
    $("examStatus").textContent = t.noExams;
    return;
  }

  const liveCount = visible.filter(exam => new Date(exam.start_time).getTime() <= now).length;

  $("examStatus").textContent = liveCount
    ? t.liveCount.replace("{count}", liveCount)
    : t.upcomingOnly;

  visible.forEach(exam=>{
    const start = new Date(exam.start_time).getTime();
    const end = new Date(exam.end_time).getTime();
    const isLive = now >= start && now < end;

    const card = document.createElement("div");
    card.className = "exam";

    card.appendChild(makeText("h3", exam.exam_name || "Bible Quiz"));

    const state = makeText("p", isLive ? "🟢 LIVE NOW" : "🟡 UPCOMING");
    state.className = isLive ? "live" : "upcoming";
    card.appendChild(state);

    card.appendChild(makeText("p", `📅 ${t.start}: ` + formatIST(exam.start_time)));
    card.appendChild(makeText("p", `⏰ ${t.end}: ` + formatIST(exam.end_time)));
    card.appendChild(makeText("p", `📝 ${t.questions}: ` + exam.question_count));
    card.appendChild(makeText("p", `🔁 ${t.attempts}: ` + exam.max_attempts));

    const button = document.createElement("button");
    button.textContent = isLive ? t.join : t.notStarted;
    button.disabled = !isLive;
    button.addEventListener("click", () => joinExam(exam));

    card.appendChild(button);
    list.appendChild(card);
  });
}

async function loadExams(){
  const t = i18n[currentLang] || i18n.te;
  $("examStatus").textContent = t.loading;

  try{
    const {data, error} = await db
      .from("exam_schedules")
      .select("id,exam_name,start_time,end_time,question_count,max_attempts")
      .gt("end_time", new Date().toISOString())
      .order("start_time", {ascending:true})
      .limit(50);

    if(error) throw error;

    exams = data || [];
    renderExams();
  }catch(error){
    $("examStatus").textContent = "❌ " + error.message;
    $("examStatus").className = "center error";
  }
}

$("refreshBtn").addEventListener("click", loadExams);

window.addEventListener("DOMContentLoaded", () => {
  applyTranslations();
  loadExams();
});

setInterval(renderExams, 15000);
setInterval(loadExams, 60000);
