
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGOS QUEST - Live Bible Quiz</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#202938;
}
.card{
  background:white;
  max-width:650px;
  margin:16px auto;
  padding:22px;
  border-radius:15px;
  box-shadow:0 2px 10px #dce3ee;
}
h1{color:#174ea6;text-align:center}
h2{text-align:center}
.subtitle{text-align:center;color:#64748b}
.exam{
  border:1px solid #d9e4f5;
  padding:16px;
  border-radius:12px;
  margin:14px 0;
}
.exam h3{margin-top:0;color:#174ea6}
.exam p{margin:9px 0}
button{
  background:#174ea6;
  color:white;
  padding:13px 18px;
  border:0;
  border-radius:9px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}
.refresh{background:#475569}
.live{color:#15803d;font-weight:bold}
.upcoming{color:#a16207;font-weight:bold}
.ended{color:#64748b}
.error{color:#b91c1c}
.center{text-align:center}
a{color:#174ea6}
</style>
</head>

<body>

<div class="card center">
  <h1>📖 LOGOS QUEST</h1>
  <h2>Live Bible Quiz</h2>
  <p class="subtitle">Welcome to LOGOS QUEST</p>
</div>

<div class="card">
  <h2>📚 లైవ్ బైబిల్ పరీక్షలు</h2>
  <p class="subtitle center">
    అన్ని పరీక్షల సమయాలు IST ప్రకారం
  </p>

  <div class="center">
    <button class="refresh" id="refreshBtn">
      🔄 Refresh Exams
    </button>
  </div>

  <p id="examStatus" class="center">
    పరీక్షల వివరాలు లోడ్ అవుతున్నాయి...
  </p>

  <div id="examList"></div>
</div>

<div class="card center">
  <h2>🏆 విజేతలు</h2>
  <p>ఈ వారపు విజేతలు త్వరలో కనిపిస్తారు.</p>
  <a href="leaderboard.html">View Leaderboard</a>
</div>

<div class="card center">
  <h2>📊 నా ఫలితాలు</h2>
  <p>పరీక్ష ఫలితాలు Results Pageలో చూడవచ్చు.</p>
  <a href="results.html">View Results</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://jfhlesmfgwxlqdccfgit.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WJ8KhxWCP1tgi04LwHIx9Q_Os4FNKfp";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let exams = [];

function formatIST(value){
  return new Intl.DateTimeFormat("en-IN",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    hour12:true
  }).format(new Date(value));
}

function makeText(tag,text){
  const element = document.createElement(tag);
  element.textContent = text;
  return element;
}

function joinExam(exam){
  const now = Date.now();
  const start = new Date(exam.start_time).getTime();
  const end = new Date(exam.end_time).getTime();

  if(now < start){
    alert("ఈ పరీక్ష ఇంకా ప్రారంభం కాలేదు.");
    return;
  }

  if(now >= end){
    alert("ఈ పరీక్ష సమయం ముగిసింది.");
    return;
  }

  const params = new URLSearchParams({
    exam_id:String(exam.id)
  });

window.location.href =
  "exam.html?" + params.toString();
}

function renderExams(){
  const list = $("examList");
  list.replaceChildren();

  const now = Date.now();

  const visible = exams.filter(exam =>
    new Date(exam.end_time).getTime() > now
  );

  if(!visible.length){
    $("examStatus").textContent =
      "ప్రస్తుతం లైవ్ లేదా రాబోయే పరీక్షలు లేవు.";
    return;
  }

  const liveCount = visible.filter(exam =>
    new Date(exam.start_time).getTime() <= now
  ).length;

  $("examStatus").textContent =
    liveCount
      ? "🟢 " + liveCount + " Live Exam(s) available"
      : "రాబోయే పరీక్షలు క్రింద చూడండి.";

  visible.forEach(exam=>{
    const start = new Date(exam.start_time).getTime();
    const end = new Date(exam.end_time).getTime();
    const isLive = now >= start && now < end;

    const card = document.createElement("div");
    card.className = "exam";

    card.appendChild(
      makeText("h3",exam.exam_name || "Bible Quiz")
    );

    const state = makeText(
      "p",
      isLive ? "🟢 LIVE NOW" : "🟡 UPCOMING"
    );
    state.className = isLive ? "live" : "upcoming";
    card.appendChild(state);

    card.appendChild(
      makeText("p","📅 Start: " + formatIST(exam.start_time))
    );
    card.appendChild(
      makeText("p","⏰ End: " + formatIST(exam.end_time))
    );
    card.appendChild(
      makeText("p","📝 Questions: " + exam.question_count)
    );

    card.appendChild(
      makeText("p","🔁 Attempts: " + exam.max_attempts)
    );

    const button = document.createElement("button");
    button.textContent = isLive
      ? "▶ Join Exam"
      : "⏳ Exam Not Started";

    button.disabled = !isLive;
    button.addEventListener("click",()=>joinExam(exam));

    card.appendChild(button);
    list.appendChild(card);
  });
}

async function loadExams(){
  $("examStatus").textContent =
    "పరీక్షల వివరాలు లోడ్ అవుతున్నాయి...";

  try{
    const {data,error} = await db
      .from("exam_schedules")
      .select(
        "id,exam_name,start_time,end_time,question_count,max_attempts"
      )
      .gt("end_time",new Date().toISOString())
      .order("start_time",{ascending:true})
      .limit(50);

    if(error) throw error;

    exams = data || [];
    renderExams();

  }catch(error){
    console.error("Exam loading error:",error);
    $("examStatus").textContent =
      "❌ Exams loading error: " + error.message;
    $("examStatus").className = "center error";
  }
}

$("refreshBtn").addEventListener("click",loadExams);

loadExams();

setInterval(renderExams,15000);
setInterval(loadExams,60000);
</script>

</body>
</html>
