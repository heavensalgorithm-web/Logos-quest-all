<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGOS QUEST – Bible Quiz</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2ff;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #0002;
}
h1 { color: #243c91; }
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  background: #243c91;
  color: white;
  cursor: pointer;
}
.option {
  background: #e0e7ff;
  color: black;
}
.selected {
  background: #93c5fd;
}
.hidden { display: none; }
</style>
</head>

<body>
<div class="container">

<h1>✝ LOGOS QUEST</h1>
<h3>Live Bible Quiz</h3>

<div id="registration">
  <h2>విద్యార్థి నమోదు</h2>

  <input id="name" placeholder="మీ పేరు *" required>
  <input id="mobile" placeholder="మొబైల్ నంబర్ *"
         inputmode="numeric" maxlength="10" required>
  <input id="email" type="email"
         placeholder="ఈమెయిల్ (ఐచ్ఛికం)">

  <h3>ప్రశ్నల సంఖ్య</h3>
  <select id="questionCount">
    <option value="10">10 ప్రశ్నలు</option>
    <option value="20">20 ప్రశ్నలు</option>
    <option value="50">50 ప్రశ్నలు</option>
    <option value="100">100 ప్రశ్నలు</option>
  </select>

  <button onclick="startQuiz()">పరీక్ష ప్రారంభించండి</button>
</div>

<div id="quiz" class="hidden">
  <h3 id="progress"></h3>
  <h2 id="question"></h2>
  <div id="options"></div>
  <button id="nextBtn" onclick="nextQuestion()" disabled>
    తదుపరి ప్రశ్న
  </button>
</div>

<div id="result" class="hidden">
  <h2>పరీక్ష పూర్తయింది!</h2>
  <h3 id="studentResult"></h3>
  <h2 id="marks"></h2>
  <p>సరైన సమాధానాలు అడ్మిన్ విడుదల చేసిన తర్వాత మాత్రమే కనిపిస్తాయి.</p>
  <button onclick="location.reload()">హోమ్ పేజీ</button>
</div>

</div>
