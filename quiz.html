<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGOS QUEST - Live Exam</title>
<link rel="icon" type="image/png" href="icon-512.png">

<style>
:root {
  --bg-gradient: radial-gradient(circle at top, #1e3a8a 0%, #090d16 100%);
  --card-bg: rgba(22, 33, 62, 0.85);
  --card-border: rgba(234, 179, 8, 0.3);
  --gold-primary: #facc15;
  --gold-dark: #ca8a04;
  --gold-glow: rgba(250, 204, 21, 0.35);
  --text-main: #f8fafc;
  --text-muted: #cbd5e1;
  --live-green: #10b981;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  margin: 0;
  padding: 16px;
  color: var(--text-main);
  min-height: 100vh;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  padding: 22px;
  margin: 12px auto;
  border-radius: 20px;
  max-width: 680px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding-bottom: 14px;
  margin-bottom: 16px;
}

.exam-title {
  color: var(--gold-primary);
  font-size: 18px;
  font-weight: 800;
  margin: 0;
}

.timer-badge {
  background: rgba(239, 68, 68, 0.18);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: #fca5a5;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 10px;
  font-size: 15px;
}

.q-counter {
  font-size: 13px;
  color: var(--gold-primary);
  font-weight: 700;
  margin-bottom: 8px;
}

.q-text {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.55;
  color: #ffffff;
  margin-bottom: 18px;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  width: 100%;
  text-align: left;
  background: rgba(15, 23, 42, 0.8);
  border: 1.5px solid rgba(255, 255, 255, 0.14);
  color: var(--text-main);
  padding: 14px 16px;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-btn:hover {
  border-color: var(--gold-primary);
  background: rgba(30, 58, 138, 0.45);
}

.option-btn.selected {
  background: linear-gradient(135deg, rgba(250, 204, 21, 0.22) 0%, rgba(202, 138, 4, 0.28) 100%);
  border-color: var(--gold-primary);
  color: #ffffff;
  font-weight: 700;
  box-shadow: 0 0 12px var(--gold-glow);
}

.opt-letter {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  color: var(--gold-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}

.option-btn.selected .opt-letter {
  background: var(--gold-primary);
  color: #0b1329;
}

.nav-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
}

.btn-nav {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: #fff;
}

.btn-gold {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  border: none;
  background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
  color: #0b1329;
  box-shadow: 0 4px 14px var(--gold-glow);
}

.btn-gold:disabled, .btn-nav:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.center { text-align: center; }

.error-box {
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.35);
  padding: 16px;
  border-radius: 14px;
  text-align: center;
}
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div id="loadingView" class="center" style="padding:30px 10px;">
    <img src="icon-512.png" alt="Logo" style="width:70px; height:70px; border-radius:18px; border:2px solid var(--gold-primary); margin-bottom:12px;">
    <h2 style="color:var(--gold-primary); margin:0 0 8px;" id="statusTitle">పరీక్ష లోడ్ అవుతోంది...</h2>
    <p id="statusSub" style="color:var(--text-muted); font-size:14px;">దయచేసి వేచి ఉండండి</p>
  </div>

  <div id="quizView" style="display:none;">
    <div class="top-bar">
      <div>
        <h1 class="exam-title" id="examTitleDisplay">LOGOS QUEST</h1>
        <span style="font-size:12px; color:var(--text-muted);" id="studentBadge">Student</span>
      </div>
      <div class="timer-badge" id="timerDisplay">⏱ 00:00</div>
    </div>

    <div class="q-counter" id="questionCounter">Question 1 of 10</div>
    <div class="q-text" id="questionText">...</div>
    <div class="options-list" id="optionsContainer"></div>

    <div class="nav-row">
      <button type="button" class="btn-nav" id="prevBtn" onclick="prevQuestion()">← వెనుకకు</button>
      <button type="button" class="btn-gold" id="nextBtn" onclick="nextQuestion()">తదుపరి →</button>
      <button type="button" class="btn-gold" id="submitBtn" style="display:none;" onclick="submitExam(false)">✅ పరీక్ష సబ్మిట్ చేయండి</button>
    </div>
  </div>

  <div id="resultView" style="display:none; text-align:center; padding:20px 10px;">
    <div style="font-size:48px; margin-bottom:10px;">🎉</div>
    <h2 style="color:var(--gold-primary); margin:0 0 8px;" id="resHeading">పరీక్ష పూర్తయింది!</h2>
    <p id="resScoreText" style="font-size:20px; font-weight:800; color:#fff; margin:12px 0;"></p>
    <p id="resSubText" style="font-size:14px; color:var(--text-muted); margin-bottom:20px;"></p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <a href="leaderboard.html" class="btn-gold" style="text-decoration:none; max-width:200px;">🏆 లీడర్‌బోర్డ్</a>
      <a href="index.html" class="btn-nav" style="text-decoration:none; max-width:200px;">🏠 హోమ్ పేజీ</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jfhlesmfgwxlqdccfgit.supabase.co";
const SUPABASE_KEY = "sb_publishable_WJ8KhxWCP1tgi04LwHIx9Q_Os4FNKfp";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

const urlParams = new URLSearchParams(window.location.search);
const examId = urlParams.get("exam_id");
const lang = urlParams.get("lang") || localStorage.getItem("logos_quest_lang") || "te";

let savedUser = {};
try {
  savedUser = JSON.parse(localStorage.getItem("logos_quest_user") || "{}");
} catch(e) {}

const studentName = decodeURIComponent(urlParams.get("user_name") || savedUser.name || "Student");
const studentEmail = (urlParams.get("email") || savedUser.email || "").toLowerCase();
const studentMobile = urlParams.get("mobile") || savedUser.phone || studentEmail || "00000";

let examData = null;
let questions = [];
let currentIndex = 0;
let userAnswers = {};
let attemptId = null;
let timerInterval = null;
let isSubmitted = false;

const labels = {
  te: { prev: "← వెనుకకు", next: "తదుపరి →", submit: "✅ సబ్మిట్ చేయండి", qOf: "ప్రశ్న {c} / {t}", done: "పరీక్ష పూర్తయింది!", score: "మీ స్కోర్: {s} / {t}" },
  en: { prev: "← Previous", next: "Next →", submit: "✅ Submit Exam", qOf: "Question {c} of {t}", done: "Exam Completed!", score: "Your Score: {s} / {t}" },
  ta: { prev: "← முந்தைய", next: "அடுத்து →", submit: "✅ சமர்ப்பிக்கவும்", qOf: "கேள்வி {c} / {t}", done: "தேர்வு முடிந்தது!", score: "உங்கள் மதிப்பெண்: {s} / {t}" },
  hi: { prev: "← पिछला", next: "अगला →", submit: "✅ सबमिट करें", qOf: "प्रश्न {c} / {t}", done: "परीक्षा पूर्ण हुई!", score: "आपका स्कोर: {s} / {t}" }
};

function showError(msg) {
  $("loadingView").innerHTML = `
    <div class="error-box">
      <p style="margin:0 0 14px; font-weight:700;">❌ ${msg}</p>
      <a href="index.html" class="btn-gold" style="display:inline-block; text-decoration:none; padding:10px 20px;">🏠 హోమ్ పేజీకి వెళ్ళండి</a>
    </div>
  `;
}

async function initExam() {
  if (!examId) {
    showError("Exam ID కనుగొనబడలేదు. దయచేసి హోమ్ పేజీ నుండి పరీక్షలో చేరండి.");
    return;
  }

  const t = labels[lang] || labels.te;
  $("prevBtn").textContent = t.prev;
  $("nextBtn").textContent = t.next;
  $("submitBtn").textContent = t.submit;
  $("studentBadge").textContent = "👤 " + studentName;

  try {
    // 1. Fetch Exam Schedule
    const { data: exam, error: examErr } = await db
      .from("exam_schedules")
      .select("*")
      .eq("id", examId)
      .single();

    if (examErr || !exam) {
      throw new Error("ఈ పరీక్ష వివరాలు కనుగొనబడలేదు.");
    }

    examData = exam;
    $("examTitleDisplay").textContent = exam.exam_name || "LOGOS QUEST";

    const now = Date.now();
    const start = new Date(exam.start_time).getTime();
    const end = new Date(exam.end_time).getTime();

    if (now < start) {
      throw new Error("ఈ పరీక్ష ఇంకా ప్రారంభం కాలేదు.");
    }
    if (now >= end) {
      throw new Error("ఈ పరీక్ష సమయం ముగిసింది.");
    }

    // 2. Check Attempts Limit
    let attemptQuery = db
      .from("secure_exam_attempts")
      .select("id, status")
      .eq("exam_id", examId)
      .eq("status", "submitted");

    if (studentEmail) {
      attemptQuery = attemptQuery.or(`student_email.eq.${studentEmail},student_mobile.eq.${studentMobile}`);
    } else {
      attemptQuery = attemptQuery.eq("student_mobile", studentMobile);
    }

    const { data: prevAttempts } = await attemptQuery;
    const maxAttempts = Number(exam.max_attempts) || 1;
    if (prevAttempts && prevAttempts.length >= maxAttempts) {
      throw new Error(`మీరు ఇప్పటికే గరిష్టంగా (${maxAttempts}) సార్లు ఈ పరీక్ష రాశారు.`);
    }

    // 3. Load Questions
    const qLimit = Number(exam.question_count) || 10;
    const { data: qList, error: qErr } = await db
      .from("bible_questions")
      .select("*")
      .limit(qLimit);

    if (qErr || !qList || qList.length === 0) {
      throw new Error("ఈ పరీక్షకు ప్రశ్నలు ఇంకా జతచేయబడలేదు.");
    }

    // Load Translations if needed
    let transMap = {};
    if (lang !== "en") {
      const qIds = qList.map(q => q.id);
      const { data: transRows } = await db
        .from("bible_question_translations")
        .select("*")
        .in("question_id", qIds)
        .eq("lang", lang);

      if (transRows) {
        transRows.forEach(tr => {
          transMap[tr.question_id] = tr;
        });
      }
    }

    questions = qList.map(q => {
      const tr = transMap[q.id] || {};
      return {
        id: q.id,
        question: tr.question_text || q.question_text || q.question || "",
        options: [
          tr.option_a || q.option_a || "",
          tr.option_b || q.option_b || "",
          tr.option_c || q.option_c || "",
          tr.option_d || q.option_d || ""
        ],
        correct: (q.correct_option || q.correct_answer || "A").toString().trim().toUpperCase()
      };
    });

    // 4. Create Active Attempt Record (For Admin Live Monitoring)
    const { data: newAttempt, error: attErr } = await db
      .from("secure_exam_attempts")
      .insert({
        exam_id: examId,
        student_name: studentName,
        student_email: studentEmail || null,
        student_mobile: studentMobile,
        status: "in_progress",
        score: 0,
        started_at: new Date().toISOString()
      })
      .select("id")
      .single();

    if (!attErr && newAttempt) {
      attemptId = newAttempt.id;
    }

    // 5. Start Exam UI & Timer
    $("loadingView").style.display = "none";
    $("quizView").style.display = "block";
    startTimer(end);
    renderQuestion();

  } catch (err) {
    showError(err.message);
  }
}

function startTimer(endTimeMs) {
  function tick() {
    const remaining = Math.max(0, Math.floor((endTimeMs - Date.now()) / 1000));
    const mins = String(Math.floor(remaining / 60)).padStart(2, "0");
    const secs = String(remaining % 60).padStart(2, "0");
    $("timerDisplay").textContent = `⏱ ${mins}:${secs}`;

    if (remaining <= 0 && !isSubmitted) {
      clearInterval(timerInterval);
      submitExam(true);
    }
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

function renderQuestion() {
  const t = labels[lang] || labels.te;
  const q = questions[currentIndex];
  $("questionCounter").textContent = t.qOf.replace("{c}", currentIndex + 1).replace("{t}", questions.length);
  $("questionText").textContent = q.question;

  const container = $("optionsContainer");
  container.innerHTML = "";
  const letters = ["A", "B", "C", "D"];

  q.options.forEach((optText, idx) => {
    const letter = letters[idx];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn" + (userAnswers[q.id] === letter ? " selected" : "");
    btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
    btn.onclick = () => {
      userAnswers[q.id] = letter;
      renderQuestion();
    };
    container.appendChild(btn);
  });

  $("prevBtn").disabled = currentIndex === 0;
  if (currentIndex === questions.length - 1) {
    $("nextBtn").style.display = "none";
    $("submitBtn").style.display = "block";
  } else {
    $("nextBtn").style.display = "block";
    $("submitBtn").style.display = "none";
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

async function submitExam(isAuto) {
  if (isSubmitted) return;
  if (!isAuto && !confirm("మీరు పరీక్షను సబ్మిట్ చేయాలనుకుంటున్నారా?")) return;

  isSubmitted = true;
  clearInterval(timerInterval);
  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Submitting...";

  let score = 0;
  questions.forEach(q => {
    const ans = userAnswers[q.id];
    if (ans && ans === q.correct) {
      score++;
    }
  });

  try {
    if (attemptId) {
      await db
        .from("secure_exam_attempts")
        .update({
          score: score,
          status: "submitted",
          submitted_at: new Date().toISOString()
        })
        .eq("id", attemptId);
    } else {
      await db
        .from("secure_exam_attempts")
        .insert({
          exam_id: examId,
          student_name: studentName,
          student_email: studentEmail || null,
          student_mobile: studentMobile,
          score: score,
          status: "submitted",
          submitted_at: new Date().toISOString()
        });
    }
  } catch(e) {}

  const t = labels[lang] || labels.te;
  $("quizView").style.display = "none";
  $("resultView").style.display = "block";
  $("resHeading").textContent = t.done;
  $("resScoreText").textContent = t.score.replace("{s}", score).replace("{t}", questions.length);
  $("resSubText").textContent = isAuto ? "సమయం ముగియడంతో పరీక్ష ఆటోమేటిక్‌గా సబ్మిట్ చేయబడింది." : "మీ సమాధానాలు విజయవంతంగా నమోదు చేయబడ్డాయి.";
}

window.addEventListener("DOMContentLoaded", initExam);
</script>
</body>
</html>
