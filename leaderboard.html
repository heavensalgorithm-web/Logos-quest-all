function formatIST(value) {
  return new Intl.DateTimeFormat("en-IN", {
    timeZone: "Asia/Kolkata",
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }).format(new Date(value));
}

function formatTime(seconds) {
  const value = Number(seconds);
  if (!Number.isFinite(value) || value < 0) return "-";
  const min = Math.floor(value / 60);
  const sec = Math.floor(value % 60);
  return String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function clearTable(id) {

function medal(rank) {
  if (rank === 1) return "🥇 1";
  if (rank === 2) return "🥈 2";
  if (rank === 3) return "🥉 3";
  return String(rank);
}

  const loading = document.createElement("option");
  loading.value = "";
  loading.textContent = t.loadingExams;
  select.appendChild(loading);

  try {
    const url = SUPABASE_URL + "/rest/v1/exam_schedules?select=id,exam_name,start_time,end_time&order=start_time.desc&limit=100";
    const response = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
    if (!response.ok) throw new Error("HTTP " + response.status);

    exams = await response.json();
    select.replaceChildren();

    if (!exams.length) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = t.noExams;
      select.appendChild(option);
      $("liveStatus").textContent = t.noExams;
      return;
    }

    exams.forEach(exam => {
      const option = document.createElement("option");
      option.value = exam.id;
      option.textContent = exam.exam_name + " - " + formatIST(exam.start_time);
      select.appendChild(option);
    });

    await loadLiveLeaderboard();
  } catch (error) {
    $("liveStatus").textContent = "❌ " + error.message;
    $("liveStatus").className = "status error";
  }
}

// 2. లైవ్ లీడర్‌బోర్డ్ మరియు టాప్ 3 పోడియం రెండరింగ్
async function loadLiveLeaderboard() {
  const t = i18n[currentLang] || i18n.te;
  const examId = $("examSelect").value;
  clearTable("liveLeaderboardBody");
  $("top3Podium").replaceChildren();
  $("top3Podium").classList.add("hidden");
  $("liveStatus").className = "status";

  if (!examId) {
    $("liveStatus").textContent = t.selectPrompt;
    return;
  }

  const exam = exams.find(e => e.id === examId);
  if (!exam) {
    $("liveStatus").textContent = t.noDetails;
    return;
  }

  $("examInfo").classList.remove("hidden");
  $("examInfo").textContent = "📅 " + exam.exam_name + " | Start: " + formatIST(exam.start_time) + " | End: " + formatIST(exam.end_time);

  if (Date.now() < Date.parse(exam.end_time)) {
    $("liveStatus").textContent = t.examNotEnded;
    return;
  }

  $("liveStatus").textContent = t.loadingResults;

  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_secure_exam_top10", {
      method: "POST",
      headers,
      body: JSON.stringify({ p_exam_id: examId })
    });

    if (!response.ok) throw new Error("HTTP " + response.status);
    const results = await response.json();

    if (!Array.isArray(results) || !results.length) {
      $("liveStatus").textContent = t.noResults;
      return;
    }

    // TOP 3 విజేతల పోడియం సెక్షన్
    const top3 = results.slice(0, 3);
    const podiumEl = $("top3Podium");
    podiumEl.classList.remove("hidden");

    top3.forEach((s, idx) => {
      const rank = idx + 1;
      const card = document.createElement("div");
      card.className = `podium-card rank-${rank}`;

      const avatar = s.photo_url || "icon-512.png";
      const medalIcon = rank === 1 ? "👑" : rank === 2 ? "🥈" : "🥉";

      card.innerHTML = `
        <div class="podium-avatar-box">
          <img src="${avatar}" class="podium-photo" alt="${s.student_name}">
          <span class="podium-badge">${medalIcon}</span>
        </div>
        <div class="podium-name">${s.student_name}</div>
        <div class="podium-score">${s.score}/${s.total_questions} Pts</div>
        <div style="font-size:12px; color:var(--text-muted);">${formatTime(s.time_seconds)}</div>
      `;
      podiumEl.appendChild(card);
    });

    // పూర్తి టేబుల్ రెండరింగ్
    results.forEach((student, index) => {
      const tr = document.createElement("tr");
      if (index === 0) tr.className = "gold";
      else if (index === 1) tr.className = "silver";
      else if (index === 2) tr.className = "bronze";

      const rank = Number(student.rank_position) || index + 1;
      const location = [student.student_town, student.student_state].filter(Boolean).join(", ");
      const avatarSrc = student.photo_url || "icon-512.png";

      tr.innerHTML = `
        <td>${medal(rank)}</td>
        <td>
          <div class="table-user-cell">
            <img src="${avatarSrc}" class="table-avatar" alt="Avatar">
            <span>${student.student_name}</span>
          </div>
        </td>
        <td>${location || "-"}</td>
        <td><strong>${student.score}/${student.total_questions}</strong></td>
        <td>${formatTime(student.time_seconds)}</td>
      `;

      $("liveLeaderboardBody").appendChild(tr);
    });

    $("liveStatus").textContent = t.participantsCount.replace("{count}", results.length);
    $("liveStatus").className = "status success";
  } catch (error) {
    $("liveStatus").textContent = "❌ " + error.message;
    $("liveStatus").className = "status error";
  }
}

$("examSelect").addEventListener("change", loadLiveLeaderboard);
$("refreshLive").addEventListener("click", loadLiveLeaderboard);

window.addEventListener("DOMContentLoaded", () => {
  applyTranslations();
  loadExams();
});
</script>
</body>
