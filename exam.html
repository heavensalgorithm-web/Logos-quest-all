
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGOS QUEST - Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4f7fb;font-family:Arial,sans-serif;color:#202938}
.card{max-width:680px;margin:18px auto;background:white;padding:22px;border-radius:14px;box-shadow:0 2px 10px #dce3ee}
h1,h2{text-align:center;color:#174ea6}
input,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#174ea6;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:16px;cursor:pointer}
button:disabled{background:#94a3b8}
.question{padding:16px;border:1px solid #dbe4f0;border-radius:10px;margin:15px 0}
.option{display:block;padding:10px;margin:7px 0;background:#f8fafc;border-radius:7px}
.option input{width:auto;margin:0 8px 0 0}
.hidden{display:none}
.center{text-align:center}
.error{color:#b91c1c}
#timer{font-size:23px;font-weight:bold;color:#b91c1c;text-align:center}
</style>
</head>
<body>

<div class="card center">
<h1>📖 LOGOS QUEST</h1>
<p>Live Bible Quiz</p>
<h2 id="examTitle">Loading Exam...</h2>
<p id="examInfo"></p>
</div>

<div class="card" id="registration">
<h2>📝 Student Registration</h2>
<form id="registrationForm">
<label>Full Name</label>
<input id="studentName" required minlength="2" maxlength="100">

<label>Mobile Number</label>
<input id="studentMobile" type="tel" inputmode="numeric"
pattern="[0-9]{10}" maxlength="10" required>

<label>Town</label>
<input id="studentTown" required minlength="2" maxlength="100">

<label>State</label>
<input id="studentState" required minlength="2" maxlength="100" value="Andhra Pradesh">

<label for="studentLanguage">🌐 Select Exam Language</label>
<select id="studentLanguage" required>
  <option value="">-- Select Language --</option>
  

<option value="telugu">తెలుగు (Telugu)</option>
<option value="english" disabled>English (Coming Soon)</option>
<option value="tamil" disabled>தமிழ் (Coming Soon)</option>


</select>

<button id="startBtn" type="submit">▶ Start Exam</button>
</form>
</div>

<div class="card hidden" id="examSection">
<h2>📚 Bible Quiz</h2>
<div id="timer">Time Remaining: --:--</div>
<div id="questions"></div>
<button id="submitBtn" type="button">✅ Submit Exam</button>
</div>

<div class="card hidden center" id="resultSection">
<h2>🏆 Exam Result</h2>
<h1 id="scoreText"></h1>
<p id="resultDetails"></p>
<a href="leaderboard.html">View Leaderboard</a>
 <br><br>
<button id="reviewBtn" type="button">
  📖 Review My Answers
</button>
<div id="reviewSection"></div>
</div>

<div class="card center">
<p id="status">Loading exam details...</p>
<a href="quiz.html">← Back to Exams</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jfhlesmfgwxlqdccfgit.supabase.co";
const SUPABASE_KEY="sb_publishable_WJ8KhxWCP1tgi04LwHIx9Q_Os4FNKfp";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 async function loadLoggedInStudent() {
  const { data: { user }, error } = await db.auth.getUser();

  if (error || !user) {
    window.location.replace("student-login.html");
    return;
  }

  const details = user.user_metadata || {};

  const fields = {
    studentName: details.full_name,
    studentMobile: details.mobile,
    studentTown: details.town,
    studentState: details.state
  };

  for (const [id, value] of Object.entries(fields)) {
    const input = document.getElementById(id);
    if (input) {
      input.value = value || "";
      input.readOnly = true;
    }
  }
}

loadLoggedInStudent(); 
const $=id=>document.getElementById(id);

const examId=new URLSearchParams(location.search).get("exam_id");
let exam=null;
let attemptId=null;
 let submitToken = null; 
let reviewToken = null;  
let assignedQuestions=[];
let deadline=0;
let timerHandle=null;
let submitting=false;

function showStatus(message,isError=false){
  $("status").textContent=message;
  $("status").className=isError?"error":"";
}

function formatIST(value){
 return new Intl.DateTimeFormat("en-IN",{
  timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"
 }).format(new Date(value));
}

async function loadExam(){
 try{
  if(!examId)throw new Error("Exam ID missing. Join from Exams page.");

  const {data,error}=await db.from("exam_schedules")
   .select("id,exam_name,start_time,end_time,question_count")
   .eq("id",examId).single();

  if(error)throw error;
  exam=data;

  $("examTitle").textContent=exam.exam_name;
  $("examInfo").textContent=
   "Start: "+formatIST(exam.start_time)+
   " | End: "+formatIST(exam.end_time);

  const now=Date.now();
  if(now<new Date(exam.start_time).getTime())
   throw new Error("Exam has not started yet.");
  if(now>=new Date(exam.end_time).getTime())
   throw new Error("Exam time has ended.");

  showStatus("Exam is live. Please register.");
 }catch(err){
  $("registration").classList.add("hidden");
  showStatus("❌ "+err.message,true);
 }
}

$("registrationForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=$("startBtn");
 button.disabled=true;
 showStatus("Starting secure exam...");

 try{
  const {data,error}=await db.rpc("start_secure_exam",{
   p_exam_id:examId,
   p_student_name:$("studentName").value.trim(),
   p_student_mobile:$("studentMobile").value.trim(),
   p_student_town:$("studentTown").value.trim(),
   p_student_state:$("studentState").value.trim(),
p_language:$("studentLanguage").value
  });

  if(error)throw error;
  if(!data?.attempt_id||!Array.isArray(data.questions))
   throw new Error("Unexpected exam response.");

  attemptId=data.attempt_id;
   submitToken = data.submit_token;
  assignedQuestions=data.questions;
  if(!assignedQuestions.length)throw new Error("No questions returned.");

  $("registration").classList.add("hidden");
  $("examSection").classList.remove("hidden");
  renderQuestions();

  deadline=new Date(exam.end_time).getTime();
  timerHandle=setInterval(updateTimer,1000);
  updateTimer();
  showStatus("Exam started successfully.");
 }catch(err){
  showStatus("❌ "+err.message,true);
  button.disabled=false;
 }
});

function renderQuestions(){
 const container=$("questions");
 container.replaceChildren();

 assignedQuestions.forEach((q,index)=>{
  const number=q.question_order??index+1;
  const block=document.createElement("div");
  block.className="question";

  const heading=document.createElement("h3");
  heading.textContent=number+". "+q.question;
  block.appendChild(heading);

  ["A","B","C","D"].forEach((letter,i)=>{
   const label=document.createElement("label");
   label.className="option";

   const radio=document.createElement("input");
   radio.type="radio";
   radio.name="question_"+number;
   radio.value=letter;

   const span=document.createElement("span");
   span.textContent=letter+". "+(q.options?.[i]??"");

   label.append(radio,span);
   block.appendChild(label);
  });

  container.appendChild(block);
 });
}

function updateTimer(){
 const remaining=Math.max(0,deadline-Date.now());
 const seconds=Math.ceil(remaining/1000);
 const min=Math.floor(seconds/60);
 const sec=seconds%60;
 $("timer").textContent="⏳ Time Remaining: "+
  String(min).padStart(2,"0")+":"+
  String(sec).padStart(2,"0");

 if(remaining<=0){
  clearInterval(timerHandle);
  submitExam(true);
 }
}

$("submitBtn").addEventListener("click",()=>submitExam(false));

async function submitExam(automatic){
 if(submitting||!attemptId)return;

 if(!automatic&&!confirm("Submit your exam now?"))return;

 submitting=true;
 $("submitBtn").disabled=true;
 clearInterval(timerHandle);
 showStatus("Submitting answers...");

 const answers=[];
 assignedQuestions.forEach((q,index)=>{
  const number=q.question_order??index+1;
  const checked=document.querySelector(
   'input[name="question_'+number+'"]:checked'
  );
  if(checked){
   answers.push({
    question_order:number,
    selected_answer:checked.value
   });
  }
 });

 try{
  const {data,error}=await db.rpc("submit_secure_exam",{
  p_attempt_id:attemptId,
  p_answers:answers,
  p_submit_token:submitToken
});

  if(error)throw error;
reviewToken = submitToken;
  $("examSection").classList.add("hidden");
  $("resultSection").classList.remove("hidden");
  $("scoreText").textContent=
   data.score+" / "+data.total_questions;
  $("resultDetails").textContent=
   "Percentage: "+data.percentage+"% | Time: "+
   data.time_seconds+" seconds";
  showStatus("✅ Exam submitted successfully.");
 }catch(err){
  showStatus("❌ Submission failed: "+err.message,true);
  $("submitBtn").disabled=false;
  submitting=false;
  if(Date.now()<deadline){
   timerHandle=setInterval(updateTimer,1000);
   updateTimer();
  }
 }
}
$("reviewBtn").addEventListener("click", async () => {
  const section = $("reviewSection");
  section.textContent = "Loading your answers...";

  if (!attemptId || !submitToken) {
    section.textContent =
      "Review token unavailable. Please use your original exam session.";
    return;
  }

  try {
    const { data, error } = await db.rpc(
      "get_secure_exam_review",
      {
        p_attempt_id: attemptId,
        p_submit_token: submitToken
      }
    );

    if (error) throw error;

    section.replaceChildren();

    const questions = data.questions || [];

    
let correctCount = 0;
let wrongCount = 0;
let unansweredCount = 0;

questions.forEach((q, i) => {
  const card = document.createElement("div");
  card.style.cssText =
    "text-align:left;padding:15px;margin:12px 0;border:1px solid #ddd;border-radius:8px;";

  const heading = document.createElement("h3");
  heading.textContent = (i + 1) + ". " + q.question_text;
  card.appendChild(heading);

  const options = {
    A: q.option_a,
    B: q.option_b,
    C: q.option_c,
    D: q.option_d
  };

  const selectedKey = q.selected_answer;
  const correctKey = q.correct_answer;

  const selected = document.createElement("p");
  const correct = document.createElement("p");

  if (!selectedKey) {
    unansweredCount++;
    selected.textContent = "⚪ Your Answer: Not Answered";
    selected.style.color = "#64748b";
  } else if (selectedKey === correctKey) {
    correctCount++;
    selected.textContent =
      "✅ Your Answer: " + selectedKey +
      " – " + (options[selectedKey] || "");
    selected.style.color = "green";
  } else {
    wrongCount++;
    selected.textContent =
      "❌ Your Answer: " + selectedKey +
      " – " + (options[selectedKey] || "");
    selected.style.color = "red";
  }

  correct.textContent =
    "✅ Correct Answer: " + correctKey +
    " – " + (options[correctKey] || "");
  correct.style.color = "green";

  card.appendChild(selected);
  card.appendChild(correct);
  section.appendChild(card);
});

const summary = document.createElement("div");
summary.style.cssText =
  "padding:15px;margin:15px 0;background:#f1f5f9;border-radius:10px;font-weight:bold;text-align:left;";

summary.textContent =
  "📊 Total: " + questions.length +
  " | ✅ Correct: " + correctCount +
  " | ❌ Wrong: " + wrongCount +
  " | ⚪ Unanswered: " + unansweredCount;

section.prepend(summary);


    if (!questions.length) {
      section.textContent = "No review questions available.";
    }

  } catch (err) {
    section.textContent =
      "Review unavailable: " + err.message;
  }
});
loadExam();
</script>
</body>
</html>
