async function loadLoggedInStudent() {
  const localUser = JSON.parse(localStorage.getItem("logos_quest_user") || "{}");

  let details = {
    full_name: localUser.name || "GTR Brock",
    mobile: localUser.identifier || localUser.mobile || "8374539887",
    town: "Renigunta",
    state: "Andhra Pradesh"
  };

  try {
    const { data: { user } } = await db.auth.getUser();
    if (user && user.user_metadata) {
      details = {
        full_name: user.user_metadata.full_name || details.full_name,
        mobile: user.user_metadata.mobile || details.mobile,
        town: user.user_metadata.town || details.town,
        state: user.user_metadata.state || details.state
      };
    }
  } catch (e) {}

  const fields = {
    studentName: details.full_name,
    studentMobile: details.mobile,
    studentTown: details.town,
    studentState: details.state
  };

  for (const [id, value] of Object.entries(fields)) {
    const input = document.getElementById(id);
    if (input) {
      input.value = value || "";
      input.readOnly = true;
    }
  }
}

function showStatus(message, isError = false) {
  $("status").textContent = message;
  $("status").className = isError ? "error" : "success";
}

function formatIST(value) {
  return new Intl.DateTimeFormat("en-IN", {
    timeZone: "Asia/Kolkata",
    dateStyle: "medium",
    timeStyle: "short"
  }).format(new Date(value));
}

async function loadExam() {
  try {
    if (!examId) throw new Error("Exam ID missing. Join from Exams page.");

    const { data, error } = await db.from("exam_schedules")
      .select("id,exam_name,start_time,end_time,question_count")
      .eq("id", examId).single();

    if (error) throw error;
    exam = data;

    $("examTitle").textContent = exam.exam_name;
    $("examInfo").textContent =
      "Start: " + formatIST(exam.start_time) +
      " | End: " + formatIST(exam.end_time);

    const now = Date.now();
    if (now < new Date(exam.start_time).getTime())
      throw new Error("Exam has not started yet.");
    if (now >= new Date(exam.end_time).getTime())
      throw new Error("Exam time has ended.");

    showStatus("Exam is live. Please verify and start.");
  } catch (err) {
    $("registration").classList.add("hidden");
    showStatus("❌ " + err.message, true);
  }
}

async function loadTranslations(questionIds) {
  if (!questionIds || !questionIds.length) return;
  try {
    const { data, error } = await db
      .from("bible_question_translations")
      .select("question_id, language, question_text, option_a, option_b, option_c, option_d")
      .in("question_id", questionIds);

    if (!error && data) {
      data.forEach(t => {
        if (!translationsMap[t.question_id]) {
          translationsMap[t.question_id] = {};
        }
        translationsMap[t.question_id][t.language] = t;
      });
    }
  } catch (e) {
    console.warn("Could not pre-fetch translations:", e);
  }
}

    currentLangCode = reverseLangMap[currentLanguage] || "te";
    $("inExamLangSwitcher").value = currentLanguage;
    $("langSelect").value = currentLangCode;

    const { data, error } = await db.rpc("start_secure_exam", {
      p_exam_id: examId,
      p_student_name: $("studentName").value.trim() || "GTR Brock",
      p_student_mobile: $("studentMobile").value.trim() || "8374539887",
      p_student_town: $("studentTown").value.trim() || "Renigunta",
      p_student_state: $("studentState").value.trim() || "Andhra Pradesh",

    if (!data?.attempt_id || !Array.isArray(data.questions))
      throw new Error("Unexpected exam response.");

    attemptId = data.attempt_id;
    submitToken = data.submit_token;
    assignedQuestions = data.questions;
    if (!assignedQuestions.length) throw new Error("No questions assigned for this exam.");

    const qIds = assignedQuestions.map(q => q.question_id || q.id).filter(Boolean);
    await loadTranslations(qIds);

    $("registration").classList.add("hidden");
    $("examSection").classList.remove("hidden");
    renderQuestions();

    deadline = new Date(exam.end_time).getTime();
    timerHandle = setInterval(updateTimer, 1000);
    updateTimer();
    showStatus("Exam started successfully.");
  } catch (err) {
    showStatus("❌ " + err.message, true);
    button.disabled = false;
  }
});

function getSelectedAnswers() {
  const selected = {};
  assignedQuestions.forEach((q, index) => {
    const number = q.question_order ?? index + 1;
    const checked = document.querySelector(`input[name="question_${number}"]:checked`);
    if (checked) {
      selected[number] = checked.value;
    }
  });
  return selected;
}

function restoreAnswers(selected) {
  Object.entries(selected).forEach(([number, val]) => {
    const target = document.querySelector(`input[name="question_${number}"][value="${val}"]`);
    if (target) target.checked = true;
  });
}

function renderQuestions() {
  const container = $("questions");
  container.replaceChildren();

  assignedQuestions.forEach((q, index) => {
    const number = q.question_order ?? index + 1;
    const block = document.createElement("div");
    block.className = "question";

    const qId = q.question_id || q.id;
    let text = q.question;
    let opts = q.options || [];

    if (translationsMap[qId] && translationsMap[qId][currentLanguage]) {
      const trans = translationsMap[qId][currentLanguage];
      text = trans.question_text || text;
      opts = [trans.option_a, trans.option_b, trans.option_c, trans.option_d];
    }

    const heading = document.createElement("h3");
    heading.textContent = number + ". " + text;
    block.appendChild(heading);

    ["A", "B", "C", "D"].forEach((letter, i) => {
      const label = document.createElement("label");
      label.className = "option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "question_" + number;
      radio.value = letter;

      const span = document.createElement("span");
      span.textContent = letter + ". " + (opts[i] ?? "");

      label.append(radio, span);
      block.appendChild(label);
    });

    container.appendChild(block);
  });
}

$("inExamLangSwitcher").addEventListener("change", (e) => {
  currentLanguage = e.target.value;
  currentLangCode = reverseLangMap[currentLanguage] || "te";
  $("langSelect").value = currentLangCode;
  applyTranslations();
  const selected = getSelectedAnswers();
  renderQuestions();
  restoreAnswers(selected);
});

function updateTimer() {
  const t = i18n[currentLangCode] || i18n.te;
  const remaining = Math.max(0, deadline - Date.now());
  const seconds = Math.ceil(remaining / 1000);
  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;
  
  $("timer").textContent = t.timeRemaining +
    String(min).padStart(2, "0") + ":" +
    String(sec).padStart(2, "0");

  if (remaining <= 0) {
    clearInterval(timerHandle);
    submitExam(true);
  }
}

$("submitBtn").addEventListener("click", () => submitExam(false));

async function submitExam(automatic) {
  const t = i18n[currentLangCode] || i18n.te;
  if (submitting || !attemptId) return;

  if (!automatic && !confirm(t.submitConfirm)) return;

  submitting = true;
  $("submitBtn").disabled = true;
  clearInterval(timerHandle);
  showStatus(t.submitting);

  const answers = [];
  assignedQuestions.forEach((q, index) => {
    const number = q.question_order ?? index + 1;
    const checked = document.querySelector(`input[name="question_${number}"]:checked`);
    if (checked) {
      answers.push({
        question_order: number,
        selected_answer: checked.value
      });
    }
  });

  try {
    const { data, error } = await db.rpc("submit_secure_exam", {
      p_attempt_id: attemptId,
      p_answers: answers,
      p_submit_token: submitToken
    });

    if (error) throw error;
    reviewToken = submitToken;
    $("examSection").classList.add("hidden");
    $("resultSection").classList.remove("hidden");
    
    $("scoreText").textContent = data.score + " / " + data.total_questions;
    $("resultDetails").textContent =
      `${t.percentage}: ${data.percentage}% | Time: ${data.time_seconds} ${t.seconds}`;
    
    showStatus(t.submitted);
  } catch (err) {
    showStatus("❌ Submission failed: " + err.message, true);
    $("submitBtn").disabled = false;
    submitting = false;
    if (Date.now() < deadline) {
      timerHandle = setInterval(updateTimer, 1000);
      updateTimer();
    }
  }
}

$("reviewBtn").addEventListener("click", async () => {
  const section = $("reviewSection");
  section.textContent = "Loading answer review...";

  if (!attemptId || !submitToken) {
    section.textContent = "Review token unavailable. Please use your original exam session.";
    return;
  }

  try {
    const { data, error } = await db.rpc("get_secure_exam_review", {
      p_attempt_id: attemptId,
      p_submit_token: submitToken
    });

    if (error) throw error;

    section.replaceChildren();
    const questions = data.questions || [];
    
    let correctCount = 0;
    let wrongCount = 0;
    let unansweredCount = 0;

    questions.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "review-item";

      const heading = document.createElement("h3");
      heading.textContent = (i + 1) + ". " + q.question_text;
      card.appendChild(heading);

      const options = {
        A: q.option_a,
        B: q.option_b,
        C: q.option_c,
        D: q.option_d
      };

      const selectedKey = q.selected_answer;
      const correctKey = q.correct_answer;

      const selected = document.createElement("p");
      const correct = document.createElement("p");

      if (!selectedKey) {
        unansweredCount++;
        selected.textContent = "⚪ Your Answer: Not Answered";
        selected.style.color = "#94a3b8";
      } else if (selectedKey === correctKey) {
        correctCount++;
        selected.textContent = "✅ Your Answer: " + selectedKey + " – " + (options[selectedKey] || "");
        selected.style.color = "#34d399";
        selected.style.fontWeight = "bold";
      } else {
        wrongCount++;
        selected.textContent = "❌ Your Answer: " + selectedKey + " – " + (options[selectedKey] || "");
        selected.style.color = "#f87171";
        selected.style.fontWeight = "bold";
      }

      correct.textContent = "✅ Correct Answer: " + correctKey + " – " + (options[correctKey] || "");
      correct.style.color = "#34d399";

      card.appendChild(selected);
      card.appendChild(correct);
      section.appendChild(card);
    });

    const summary = document.createElement("div");
    summary.className = "review-summary";
    summary.textContent = `📊 Total: ${questions.length} | ✅ Correct: ${correctCount} | ❌ Wrong: ${wrongCount} | ⚪ Unanswered: ${unansweredCount}`;

    section.prepend(summary);

    if (!questions.length) {
      section.textContent = "No review questions available.";
    }

  } catch (err) {
    section.textContent = "Review unavailable: " + err.message;
  }
});

window.addEventListener("DOMContentLoaded", () => {
  $("langSelect").value = currentLangCode;
  $("studentLanguage").value = currentLanguage;
  $("inExamLangSwitcher").value = currentLanguage;
  applyTranslations();
  loadExam();
});
</script>
</body>
</html>
