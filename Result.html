<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGOS QUEST - నా ఫలితాలు</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101b38, #253e72);
  min-height: 100vh;
}

header {
  background: #101a32;
  color: #ffd76b;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
}

header p {
  color: white;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
}

h2 {
  text-align: center;
  color: #203a70;
}

input, button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  font-size: 16px;
}

input {
  border: 1px solid #ccc;
}

button {
  background: #1749a2;
  color: white;
  border: none;
  cursor: pointer;
}

.result {
  background: #f0f4ff;
  padding: 15px;
  border-radius: 10px;
  margin-top: 12px;
}

a {
  color: #1749a2;
}
</style>
</head>

<body>

<header>
  <h1>✝ LOGOS QUEST</h1>
  <p>నా ఫలితాలు</p>
</header>

<div class="container">

  <div class="card">

    <h2>మీ పరీక్ష ఫలితాలు</h2>

    <p>
      పరీక్ష సమయంలో ఇచ్చిన మొబైల్ నంబర్
      నమోదు చేయండి.
    </p>

    <form id="searchForm">

      <input
        id="mobile"
        type="tel"
        placeholder="10 అంకెల మొబైల్ నంబర్"
        maxlength="10"
        pattern="[0-9]{10}"
        inputmode="numeric"
        required
      >

      <button type="submit">
        ఫలితాలు చూడండి
      </button>

    </form>

    <div id="results"></div>

  </div>

  <div class="card">

    <a href="quiz.html">
      కొత్త పరీక్ష రాయండి
    </a>

    <br><br>

    <a href="index.html">
      హోమ్ పేజీ
    </a>

  </div>

</div>

<script>

document.getElementById("searchForm")
.addEventListener("submit", function(event) {

  event.preventDefault();

  const mobile = document
    .getElementById("mobile")
    .value.trim();

  const box = document.getElementById("results");

  box.innerHTML = "";

  if (!/^[0-9]{10}$/.test(mobile)) {
    box.textContent =
      "సరైన 10 అంకెల మొబైల్ నంబర్ ఇవ్వండి.";
    return;
  }

  let saved = [];

  try {

    saved = JSON.parse(
      localStorage.getItem("logosQuestResults") || "[]"
    );

    if (!Array.isArray(saved)) {
      saved = [];
    }

  } catch (error) {
    saved = [];
  }

  const matches = saved.filter(function(item) {
    return String(item.mobile) === mobile;
  });

  if (matches.length === 0) {

    box.textContent =
      "ఈ మొబైల్ నంబర్‌కు సేవ్ అయిన ఫలితాలు లేవు.";

    return;
  }

  matches.reverse().forEach(function(item) {

    const div = document.createElement("div");

    div.className = "result";

    const lines = [
      "పేరు: " + (item.name || "-"),
      "మార్కులు: " + item.score + " / " + item.total,
      "శాతం: " + item.percentage + "%",
      "సమయం: " + (item.time || "-"),
      "తేదీ: " + (item.date || "-")
    ];

    lines.forEach(function(line) {

      const p = document.createElement("p");

      p.textContent = line;

      div.appendChild(p);

    });

    box.appendChild(div);

  });

});

</script>

</body>
</html>
